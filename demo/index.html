<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cards Kit – Demo</title>
    <style>
      /* Catppuccin Latte / Mocha, as the author's HA themes, plus the color names of HA's ui_color selector. */
      .light {
        --primary-text-color: #4c4f69; --secondary-text-color: #5c5f77; --card-background-color: #eff1f5; --ha-card-background: #eff1f5;
        --secondary-background-color: #e6e9ef; --divider-color: #ccd0da; --primary-color: #8839ef;
        --warning-color: #df8e1d; --error-color: #d20f39; --disabled-color: #9ca0b0;
        --amber-color: #df8e1d; --orange-color: #fe640b; --deep-orange-color: #e64553; --teal-color: #179299; --green-color: #40a02b;
        --purple-color: #8839ef; --blue-color: #1e66f5; --light-blue-color: #209fb5; --indigo-color: #7287fd; --blue-grey-color: #6c6f85;
        background: #dce0e8;
      }
      .dark {
        --primary-text-color: #cdd6f4; --secondary-text-color: #a6adc8; --card-background-color: #1e1e2e; --ha-card-background: #1e1e2e;
        --secondary-background-color: #181825; --divider-color: #313244; --primary-color: #cba6f7;
        --warning-color: #f9e2af; --error-color: #f38ba8; --disabled-color: #6c7086;
        --amber-color: #f9e2af; --orange-color: #fab387; --deep-orange-color: #eba0ac; --teal-color: #94e2d5; --green-color: #a6e3a1;
        --purple-color: #cba6f7; --blue-color: #89b4fa; --light-blue-color: #74c7ec; --indigo-color: #b4befe; --blue-grey-color: #9399b2;
        background: #11111b;
      }
      body { margin: 0; font-family: Roboto, Inter, system-ui, sans-serif; }
      .bar { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 14px; background: #fff; border-bottom: 1px solid #ddd; }
      .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .col { padding: 20px; color: var(--primary-text-color); display: flex; flex-direction: column; gap: 28px; align-items: center; }
      .col > * { width: min(100%, 492px); }
      @media (max-width: 1000px) { .cols { grid-template-columns: minmax(0, 1fr); } }
      /* Stand-in for a section of HA's sections view: 12 columns, rows of 56 px, 8 px gaps, a heading card on top. */
      .section { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: 56px; gap: 8px; }
      .section > * { grid-column: span var(--gc, 12); grid-row: span var(--gr, 1); min-width: 0; }
      .heading { display: flex; align-items: flex-end; gap: 8px; padding: 0 4px 6px; font-size: 16px; font-weight: 500; }
      .heading svg { width: 20px; height: 20px; fill: var(--secondary-text-color); }
    </style>
  </head>
  <body>
    <div class="bar">
      <label><input type="checkbox" id="cpuOff" /> CPU nicht verfügbar</label>
      <label>Sprache <select id="lang"><option>de</option><option>en</option></select></label>
    </div>
    <div class="cols">
      <div class="col light" id="light"></div>
      <div class="col dark" id="dark"></div>
    </div>
    <script type="module">
      import { MDI } from "./icons.js";
      import { makeHass, SECTIONS } from "./mock.js";

      // Stand-ins for Home Assistant's ha-card and ha-state-icon.
      customElements.define(
        "ha-card",
        class extends HTMLElement {
          constructor() {
            super();
            this.attachShadow({ mode: "open" }).innerHTML =
              "<style>:host{display:block;box-sizing:border-box;background:var(--ha-card-background);border:var(--ha-card-border-width,1px) solid var(--ha-card-border-color,var(--divider-color));border-radius:var(--ha-card-border-radius,12px)}</style><slot></slot>";
          }
        },
      );
      const svg = (name) =>
        `<svg viewBox="0 0 24 24" style="width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);fill:currentColor;display:block"><path d="${MDI[name] || MDI["mdi:help"]}"/></svg>`;
      customElements.define(
        "ha-state-icon",
        class extends HTMLElement {
          set icon(v) { this._icon = v; this._draw(); }
          set stateObj(v) { this._st = v; this._draw(); }
          set hass(v) {}
          _draw() { this.innerHTML = svg(this._icon || this._st?.attributes?.icon); }
        },
      );
      await import("../dist/ha-cards-kit.js");

      const q = new URLSearchParams(location.search);
      const $ = (id) => document.getElementById(id);
      $("lang").value = q.get("lang") || "de";
      $("cpuOff").checked = q.get("cpuOff") === "1";
      const cards = [];
      for (const theme of ["light", "dark"]) {
        for (const sec of SECTIONS) {
          const el = document.createElement("div");
          el.className = "section";
          el.innerHTML = `<div class="heading">${svg(sec.icon)}<span>${sec.title}</span></div>`;
          for (const config of sec.cards) {
            const card = document.createElement("kpi-tile-card");
            card.setConfig({ type: "custom:kpi-tile-card", ...config });
            card.style.setProperty("--gc", config.grid_options.columns);
            card.style.setProperty("--gr", config.grid_options.rows);
            el.append(card);
            cards.push(card);
          }
          $(theme).append(el);
        }
      }
      const update = () => {
        const hass = makeHass({ lang: $("lang").value, cpuOff: $("cpuOff").checked });
        for (const c of cards) c.hass = hass;
      };
      $("lang").onchange = update;
      $("cpuOff").onchange = update;
      update();
      document.addEventListener("hass-action", (ev) => console.log("hass-action", ev.detail));
    </script>
  </body>
</html>
